name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Umbral en "critical" (no "high") porque xlsx tiene una vulnerabilidad
      # high conocida y sin fix disponible upstream, mitigada en código
      # (ver src/hooks/use-inventory.ts). Un umbral "high" dejaría el pipeline
      # permanentemente en rojo por un riesgo ya aceptado y documentado.
      - name: Dependency audit (fails on critical)
        run: npm audit --audit-level=critical
